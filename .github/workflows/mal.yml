name: Refresh MyAnimeList
on:
  schedule:
    - cron: '43 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install beautifulsoup4==4.15.0
      - run: python scripts/update-mal.py
        env:
          MAL_USERNAME: ${{ secrets.MAL_USERNAME }}
      - run: |
          git add src/data/mal.json
          git diff --cached --quiet && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: refresh MyAnimeList activity'
          git push
